aid: bolna
name: Bolna
description: >-
  Bolna is a voice AI platform for building, testing, deploying, and scaling
  conversational voice agents that place and receive phone calls with human-like,
  multilingual intelligence. The platform pairs a no-code Agent Studio with a
  Bearer-authenticated REST API (api.bolna.ai) covering agents, outbound and
  inbound calls, CSV batch campaigns, executions and transcripts, phone-number
  purchasing and search, SIP trunks, knowledge bases (RAG over PDFs/URLs),
  dispositions/extractions, providers (ASR/LLM/TTS credentials), voices,
  violations, and multi-tenant sub-accounts. Bolna integrates 20+ ASR, LLM, and
  TTS models (OpenAI, Azure, Anthropic, ElevenLabs, Deepgram) and telephony
  providers (Twilio, Plivo, SIP), and ships a hosted MCP server, an official
  Agent Skills collection, a Go CLI, and an open-source Python agent framework.
  Backed by Y Combinator and General Catalyst; strong focus on Indian-language
  (Hinglish, Hindi, Tamil, Telugu) voice agents with India data residency.
